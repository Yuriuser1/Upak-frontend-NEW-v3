[build]
publish = "out"
command = "bash ./build-static.sh"

[build.environment]
NODE_VERSION = "22"

[[plugins]]
package = "@netlify/plugin-nextjs"

[functions]
node_bundler = "nft"

# Настройки для API routes
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/__netlify-handler"
status = 200

[[redirects]]
from = "/v2/*"
to = "https://api.upak.space/v2/:splat"
status = 200
force = true

# Настройки для SSG
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
